name: CI Checks

on:
  pull_request:
    branches:
      - main
      - 'feature/update-next'

jobs:
  lint-test-build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Run Build
        run: npm run build

      - name: 5. Run Linter
        run: npm run lint

      - name: 6. Run Tests with Coverage Check
        id: coverage
        run: |
          npm run test -- --coverageReporters='json-summary'
          COVERAGE=$(cat coverage/coverage-summary.json | jq .total.lines.pct)
          echo "coverage_percentage=$COVERAGE" >> $GITHUB_OUTPUT
          
      - name: 7. Check Coverage Threshold
        if: ${{ steps.coverage.outputs.coverage_percentage < 80 }}
        run: |
          echo "Error: La cobertura de pruebas es del ${{ steps.coverage.outputs.coverage_percentage }}%, pero se requiere un mínimo del 80%."
          exit 1
      
      - name: 8. Coverage Summary
        run: |
          echo "**✨ Resumen de Cobertura de Pruebas ✨**" >> $GITHUB_STEP_SUMMARY
          echo "El coverage actual es de **${{ steps.coverage.outputs.coverage_percentage }}%**" >> $GITHUB_STEP_SUMMARY
          echo "_Requisito mínimo: 80%_" >> $GITHUB_STEP_SUMMARY