name: Gemini Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main
      - 'feature/update-next'

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 2. Run Gemini Code Assist
        uses: g-actions/gemini-code-assist@v1.1.0
        with:
         
          model: 'gemini-1.5-flash'
         
          gemini-api-key: ${{ secrets.GEMINI_API_KEY }}

          language: 'es'

          prompt: |
            Eres un experto revisor de código de Next.js y React.
            Por favor, revisa los cambios en este Pull Request.
            Enfócate en:
            1.  **Posibles errores o bugs**: Busca lógica incorrecta, condiciones de carrera o código que pueda fallar.
            2.  **Mejores prácticas**: ¿Se siguen las convenciones de React y Next.js (hooks, componentes, etc.)?
            3.  **Rendimiento**: ¿Hay algo que pueda causar un renderizado innecesario o que afecte el performance?
            4.  **Claridad y mantenibilidad**: ¿El código es fácil de leer y entender?
            Genera un resumen general de los cambios y luego añade comentarios específicos en las líneas de código donde encuentres algo relevante.